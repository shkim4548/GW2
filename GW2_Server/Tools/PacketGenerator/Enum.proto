syntax = "proto3";
package Protocol;

option csharp_namespace = "Google.Protobuf.Enum";

enum ObjectType
{
	OBJECT_TYPE_NONE = 0;
	OBJECT_TYPE_PLAYER = 1;
	OBJECT_TYPE_MINION = 2;
	OBJECT_TYPE_TURRET = 3;
	OBJECT_TYPE_NEXUS = 4;
}

enum PlayerType
{
	PLAYER_TYPE_NONE = 0;
	PLAYER_TYPE_POLICE = 1;
	PLAYER_TYPE_MONK = 2;
	PLAYER_TYPE_LIGHTSABRE = 3;
	PLAYER_TYPE_FIREFIGHTER = 4;
}

enum MoveState
{
	MOVE_STATE_NONE = 0;
	MOVE_STATE_IDLE = 1;
	MOVE_STATE_RUN = 2;
	MOVE_STATE_JUMP = 3;
	MOVE_STATE_SKILL = 4;
	MOVE_STATE_DIE = 5;
}

enum MinionState
{
	MINION_IDLE = 0;
	MINION_LINE_TRACE = 1;
	MINION_CHASE_TARGET = 2;
	MINION_ATTACK = 3;
	MINION_DEAD = 4;
}

enum CampType
{
	CAMP_NONE = 0;
	CAMP_HUMAN = 1;
	CAMP_CYBORG = 2;
	CAMP_NEUTURAL = 3;
}

enum CellFlags
{
	CELL_WALKABLE = 0;
}

enum CellLinks
{
    LINK_NORTH = 0;
    LINK_EAST  = 1;
    LINK_SOUTH = 2;
    LINK_WEST  = 3;
}

enum BuffType
{
	BUFF_NONE = 0;
	BUFF_ATTACK = 1;
	BUFF_DEFENSE = 2;
	BUFF_SPEED = 3;
	BUFF_ATTACK_SPEED = 4;
}