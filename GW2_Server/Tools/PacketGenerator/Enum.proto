syntax = "proto3";
package Protocol;

option csharp_namespace = "Google.Protobuf.Enum";

enum ObjectType
{
	OBJECT_TYPE_NONE = 0;
	OBJECT_TYPE_PLAYER = 2;
	OBJECT_TYPE_MONSTER = 3;
	OBJECT_TYPE_ENV = 4;
}
enum PlayerType
{
	PLAYER_TYPE_NONE = 0;
	PLAYER_TYPE_POLICE = 1;
	PLAYER_TYPE_MONK = 2;
	PLAYER_TYPE_LIGHTSABRE = 3;
	PLAYER_TYPE_FIREFIGHTER = 4;
}

enum MoveState
{
	MOVE_STATE_NONE = 0;
	MOVE_STATE_IDLE = 1;
	MOVE_STATE_RUN = 2;
	MOVE_STATE_JUMP = 3;
	MOVE_STATE_SKILL = 4;
	MOVE_STATE_DIE = 5;
}

enum SkillType
{
	SKILL_ID_NONE = 0;
	SKILL_ID_ATTACK = 1;
	SKILL_ID_FIRST = 2;
	SKILL_ID_SECOND = 3;
}

enum CampType
{
	CAMP_HUMAN = 0;
	CAMP_CYBORG = 1;
	CAMP_NEUTURAL = 2;
}

enum CellFlags
{
	CELL_WALKABLE = 0;
}

enum CellLinks
{
    LINK_NORTH = 0;
    LINK_EAST  = 1;
    LINK_SOUTH = 2;
    LINK_WEST  = 3;
}