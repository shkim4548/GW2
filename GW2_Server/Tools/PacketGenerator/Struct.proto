syntax = "proto3";
package Protocol;

import "Enum.proto";

option csharp_namespace = "Google.Protobuf.Struct";

message PosInfo
{
	int32 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float yaw = 5;
	MoveState state = 6;
}

message ObjectInfo
{
	int32 object_id = 1;
	int32 room_id = 2;
	ObjectType object_type = 3;
	string name = 4;
	PosInfo pos_info = 5;
	StatInfo stat_info = 6;
	// ...
}

message StatInfo
{
	uint64 hp = 1;
	uint64 max_hp = 2;
	uint64 attack = 3;
	uint64 speed = 4;
}

message Vector3Info
{
	float x = 1;
	float y = 2;
	float z = 3;
}
message RoomInfo
{
	int32 roomId = 1;
	string rommName = 2;
}

message SkillInfo
{
	float damage = 1;

}