syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

option csharp_namespace = "Google.Protobuf.Protocol";


message C_LOGIN
{
	int32 player_index = 1;
	string nickname = 2;
}

message S_LOGIN
{
	int32 player_index = 1;
	bool success = 2;
}

message C_ENTER_GAME
{
	int32 playerIndex = 1;
	int32 roomId = 2;
}

message C_LEAVE_GAME
{
	int32 player_index = 1;
	int32 roomId = 2;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_START_GAME
{
}

message S_START_GAME
{

}

message C_MOVE
{
	int32 room_id = 1;
	int32 object_id = 2;
	PosInfo start_pos = 3;
	PosInfo target_pos = 4;
	int32 client_time = 5;
}

message S_MOVE
{
	int32 room_id = 1;
	int32 object_id = 2;
	PosInfo server_pos_info = 3;
	int32 server_time = 4;
	bool corrected = 5;
}

message S_MOVE_END
{
	int32 room_id = 1;
    int32 object_id = 2;
    PosInfo server_pos_info = 3;
    int32 server_time = 4;
    bool corrected = 5;
}

message S_MINION_MOVE
{
	int32 object_id = 1;
	PosInfo start_pos = 2;
	repeated PosInfo nav_path = 3;
	float   speed      = 4;
}

message C_SKILL
{
	//SkillType skill_id = 1;
	int32 command_id = 1;
	int32 target_id = 2;
	int32 attacker_id = 3;
	int32 room_id = 4;
	int32 client_time = 5;
	float     pos_x     = 6;
    float     pos_z     = 7;
	float dir_x = 8;   // 추가: 스킬 방향 (고깔형 필요)
    float dir_z = 9;   // 추가
}

message S_SKILL
{
	int32 skill_id = 1;
	int64 target_id = 2;
	int64 attacker_id = 3;
	float current_hp = 4;
	float max_hp = 5;
	float pos_x = 3;            // 추가: 이펙트 위치
    float pos_z = 4;            // 추가
    float dir_x = 5;            // 추가: 이펙트 방향
    float dir_z = 6;            // 추가
    repeated int64 hit_target_ids = 7;  // 추가: 피격 대상 목록
}

message C_ENTER_LOBBY
{
	int32 player_index = 1;
}

message S_ENTER_LOBBY
{
	int32 player_id = 1;
	repeated RoomInfo room_infos = 2;
}

message S_DIE
{
	int32 room_id = 1;
	int32 target_id = 2;
	int32 attacker_id = 3;
}

message S_HP_CHANGE
{
	int32 target_id = 1;
	int64 current_hp = 2;
	int64 max_hp = 3;
}

message S_END_GAME
{

}

message S_RESPAWN
{
	int32 player_id = 1;
    float x = 2;
    float y = 3;
    float z = 4;
    int64 current_hp = 5;
    int64 max_hp = 6;
}

message S_HAND_SYNC 
{
    int32 player_id = 1;
    repeated int32 card_ids = 2;
}

message S_DRAW_CARD 
{
    int32 player_id = 1;
    int32 card_id   = 2;
}

message S_GOLD_UPDATE 
{
    int64 gold = 1;
}

message C_BUY_CARD 
{
    int32 room_id  = 1;
    int32 card_id  = 2;
}

message C_REMOVE_CARD 
{
    int32 room_id  = 1;
    int32 card_id  = 2;
}

message S_BUY_RESULT 
{
    bool  success  = 1;
    int32 card_id  = 2;
    int64 gold     = 3;
}

message C_SELECT_CHARACTER
{
    int32 room_id = 1;
    PlayerType player_type = 2;
}

message S_CHARACTER_SELECTED
{
    int32 player_id = 1;
    PlayerType player_type = 2;
    bool is_cancel = 3;   
}

message C_CONFIRM_CHARACTER
{
    int32 room_id = 1;
    PlayerType player_type = 2;
}

message S_BUFF_APPLIED
{
    int32     target_id  = 1;
    BuffType  buff_type  = 2;
    float     value      = 3;   
    float     duration   = 4;   
}

message S_STUN 
{
    int32 target_id = 1;
    float duration  = 2;
}
