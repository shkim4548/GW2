syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

option csharp_namespace = "Google.Protobuf.Protocol";


message C_LOGIN
{
	string nickname = 1;
}

message S_LOGIN
{
	bool success = 1;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
	int32 roomId = 2;
}

message C_LEAVE_GAME
{
	int64 player_index = 1;
	int32 roomId = 2;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message C_SPAWN
{
	repeated ObjectInfo players = 1;
}

message C_MOVE
{
	int32 room_id = 1;
	int32 object_id = 2;
	PosInfo start_pos = 3;
	PosInfo target_pos = 4;
	int32 client_time = 5;	// Ŭ���̾�Ʈ ���� �ð�, �����׹� ������
}

message S_MOVE
{
	int32 room_id = 1;
	int32 object_id = 2;
	PosInfo server_info = 3;
	int32 server_time = 4;
	bool corrected = 5;		// Ŭ���̾�Ʈ ������ġ�� ���̰� �ִ°�?
}

message S_MOVE_END
{
	int32 object_id = 1;
	PosInfo final_pos = 2;
}

message C_SKILL
{
	int32 skill_id = 1;
	int64 target_id = 2;
	int64 attacker_id = 3;
}

message S_SKILL
{
	int32 skill_id = 1;
	int64 target_id = 2;
	int64 attacker_id = 3;
}

message C_ENTER_LOBBY
{
	// empty message, just for request
}

message S_ENTER_LOBBY
{
	int32 playerId = 1;
	repeated RoomInfo roomInfos = 2;
}